    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cozy Walks" />
    <meta property="og:description" content="Tu compañero de paseos acogedores - Rutas circulares únicas cada día" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Tu compañero de paseos acogedores" />
    <meta name="twitter:image" content="%BASE_URL%icons/icon-512.svg" />
    
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cozy Walks" />

    <!-- Preconnect para Google Maps -->
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://maps.gstatic.com" />
    
    <title>Cozy Walks - Paseos acogedores cada día</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- El service worker lo registra vite-plugin-pwa automáticamente -->
    <script>
      // Detectar instalación PWA
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Mostrar botón de instalar personalizado si se desea
        console.log('[PWA] Instalación disponible');
      });

      window.addEventListener('appinstalled', () => {
        console.log('[PWA] App instalada');
        deferredPrompt = null;
      });
    </script>
  </body>
</html>
