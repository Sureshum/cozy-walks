<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-512.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#c8754a" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Cozy Walks - Tu compañero de paseos acogedores. Rutas circulares únicas cada día con avatar en tiempo real y zonas seguras." />
    <meta name="keywords" content="caminar, paseos, rutas, GPS, salud, bienestar, naturaleza, cozy" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cozy Walks" />
    <meta property="og:description" content="Tu compañero de paseos acogedores - Rutas circulares únicas cada día" />
    <meta property="og:image" content="/icons/icon-512.svg" />
    <meta property="og:url" content="https://cozy-walks.app" />
    <meta property="og:locale" content="es_ES" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cozy Walks" />
    <meta name="twitter:description" content="Tu compañero de paseos acogedores" />
    <meta name="twitter:image" content="/icons/icon-512.svg" />
    
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cozy Walks" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Cozy Walks" />
    
    <!-- Preconnect para Google Maps -->
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://maps.gstatic.com" />
    
    <title>Cozy Walks - Paseos acogedores cada día</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Registro del Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[SW] Registrado:', registration.scope);
              
              // Verificar actualizaciones cada hora
              setInterval(() => {
                registration.update();
              }, 60 * 60 * 1000);
            })
            .catch((error) => {
              console.warn('[SW] Error en registro:', error);
            });
          
          // Manejar actualizaciones
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
        });
      }
      
      // Detectar instalación PWA
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Mostrar botón de instalar personalizado si se desea
        console.log('[PWA] Instalación disponible');
      });
      
      window.addEventListener('appinstalled', () => {
        console.log('[PWA] App instalada');
        deferredPrompt = null;
      });
    </script>
  </body>
</html>
