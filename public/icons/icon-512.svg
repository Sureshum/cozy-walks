<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo redondeado -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#fdf8f3"/>
  
  <!-- Círculo decorativo -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f0d9c4" stroke-width="8"/>
  
  <!-- Personaje caminando simplificado -->
  <g transform="translate(256, 280) scale(2.5)">
    <!-- Sombra -->
    <ellipse cx="0" cy="50" rx="20" ry="5" fill="#944831" opacity="0.1"/>
    
    <!-- Piernas -->
    <path d="M-8 32 L-12 52" stroke="#b55e3a" stroke-width="6" stroke-linecap="round"/>
    <path d="M8 32 L16 48" stroke="#b55e3a" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Cuerpo -->
    <circle cx="0" cy="18" r="18" fill="#f9efe4" stroke="#d69068" stroke-width="3"/>
    
    <!-- Cabeza -->
    <circle cx="0" cy="-12" r="16" fill="#fdf3e7" stroke="#d69068" stroke-width="3"/>
    
    <!-- Gorro -->
    <path d="M-12 -12 Q0 -22 12 -12" fill="#c8754a" stroke="#b55e3a" stroke-width="2"/>
    <circle cx="0" cy="-24" r="5" fill="#e4b896"/>
    
    <!-- Ojos -->
    <circle cx="-5" cy="-14" r="3" fill="#4a3728"/>
    <circle cx="5" cy="-14" r="3" fill="#4a3728"/>
    
    <!-- Bufanda -->
    <path d="M-14 12 Q0 18 14 12" fill="none" stroke="#ef6f22" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Brazos -->
    <path d="M-18 18 L-30 30" stroke="#d69068" stroke-width="7" stroke-linecap="round"/>
    <path d="M18 18 L30 28" stroke="#d69068" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Botones -->
    <circle cx="0" cy="8" r="2" fill="#8b6914"/>
    <circle cx="0" cy="16" r="2" fill="#8b6914"/>
  </g>
  
  <!-- Hojas decorativas -->
  <g fill="#5e8f5a" opacity="0.6">
    <path d="M100 180 Q120 160 140 180 Q130 190 110 195 Q90 190 100 180" transform="rotate(-15 120 185)"/>
    <path d="M400 190 Q420 170 440 190 Q430 200 410 205 Q390 200 400 190" transform="rotate(15 420 195)"/>
    <path d="M120 420 Q140 400 160 420 Q150 430 130 435 Q110 430 120 420" transform="rotate(-10 140 425)"/>
    <path d="M380 410 Q400 390 420 410 Q410 420 390 425 Q370 420 380 410" transform="rotate(10 400 415)"/>
  </g>
</svg>